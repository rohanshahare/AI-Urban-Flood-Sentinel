<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Maverick REVA</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="page-header">
        <h1>AI Urban Flood Sentinel</h1>
        <p class="notice">Experimental prototype. Blockage is a rough visual estimate; rainfall is operator-entered or assumed (no live feed); drain history and the demo drains are <strong>SYNTHETIC</strong>.</p>
    </header>

    <main class="layout">
        <section class="panel">
            <h2>Analyse a drain image</h2>
            <form id="analyze-form">
                <label>Image <input type="file" name="image" accept="image/*" required></label>
                <label>Drain ID <input type="text" name="drain_id" placeholder="e.g. D-017"></label>
                <div class="row">
                    <label>Latitude <input type="text" name="lat" inputmode="decimal"></label>
                    <label>Longitude <input type="text" name="lon" inputmode="decimal"></label>
                </div>
                <label>Rainfall (mm/day, optional) <input type="text" name="rainfall_mm" inputmode="decimal"></label>
                <button type="submit" id="submit-btn">Analyse</button>
            </form>
            <div id="alert-box" aria-live="polite"></div>
            <div id="result"></div>
        </section>

        <section class="panel">
            <h2>Drains</h2>
            <div id="map"></div>
            <div id="drain-list"></div>
        </section>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/state.js"></script>
    <script src="js/map.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/alerts.js"></script>
</body>
</html>
